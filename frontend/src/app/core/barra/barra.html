<header class="barra">
	<strong class="marca">ASTILEAC</strong>

	@if (usuario(); as eu) {
		<nav>
			@if (eu.perfil === 'ADMIN') {
				<a routerLink="/profissionais" routerLinkActive="ativo">Profissionais</a>
				<a routerLink="/areas-atuacao" routerLinkActive="ativo">Áreas</a>
				<a routerLink="/convites" routerLinkActive="ativo">Convites</a>
				<a routerLink="/contas" routerLinkActive="ativo">Contas</a>
			}
			@if (eu.profissionalId) {
				<a routerLink="/meu-cadastro" routerLinkActive="ativo">Meu cadastro</a>
				<a routerLink="/dados-pessoais" routerLinkActive="ativo">Meus dados</a>
			}
		</nav>

		<span class="identidade">{{ eu.login }} &middot; {{ eu.perfil }}</span>
	}

	<button type="button" (click)="sair()">Sair</button>
</header>
