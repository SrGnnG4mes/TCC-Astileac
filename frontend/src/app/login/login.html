<main class="tela">
	<form class="cartao" [formGroup]="formulario" (ngSubmit)="entrar()">
		<!-- alt vazio: o titulo logo abaixo ja diz o nome. -->
		<img class="logo" src="logo-astileac.webp" alt="" width="120" height="115" />
		<h1>ASTILEAC</h1>
		<p class="subtitulo">Cadastro de tradutores, intérpretes e guias-intérpretes de Língua Brasileira de Sinais</p>

		<label for="login">Login</label>
		<input id="login" type="text" formControlName="login" autocomplete="username" />

		<label for="senha">Senha</label>
		<input id="senha" type="password" formControlName="senha" autocomplete="current-password" />

		@if (erro()) {
			<p class="erro" role="alert">{{ erro() }}</p>
		}

		<button type="submit" [disabled]="enviando()">
			{{ enviando() ? 'Entrando...' : 'Entrar' }}
		</button>

		<a class="voltar" routerLink="/">Voltar ao site da associação</a>
	</form>
</main>
