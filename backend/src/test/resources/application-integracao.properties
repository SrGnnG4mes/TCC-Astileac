# Testes de integracao (./mvnw verify -Pintegracao).
#
# Usuario e senha do banco vem do perfil local (application-local.properties,
# fora do Git); aqui so se troca o BANCO. Os testes apagam tudo antes de
# cada caso, entao nunca podem apontar para o banco astileac de verdade --
# e a IntegracaoBase confere isso antes de apagar qualquer coisa.
#
# Crie o banco uma vez:  CREATE DATABASE astileac_teste;
# O Flyway aplica as migrations sozinho na primeira execucao.
spring.datasource.url=jdbc:postgresql://localhost:5432/astileac_teste

# Sem conta administrativa inicial: os testes criam o que precisam, e nao
# ha motivo para a senha do admin local virar hash num banco de teste.
app.admin.login=
app.admin.senha-inicial=

# Documentos gravados nos testes ficam dentro de target/, que o
# ./mvnw clean apaga -- nunca na pasta de uploads de verdade.
app.uploads.dir=target/uploads-integracao
