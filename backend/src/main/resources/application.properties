spring.application.name=astileac-backend

# Perfil usado quando NENHUM outro e informado. Diferente de
# spring.profiles.active: aqui e so o padrao, entao passar
# SPRING_PROFILES_ACTIVE=<outro> em outro ambiente simplesmente
# substitui, sem o arquivo empacotado "brigar" com a variavel.
# application-local.properties nao vai para o Git (ver .gitignore);
# copie application-example.properties para cria-lo.
spring.profiles.default=local

# Escuta apenas na propria maquina. Expor na rede tem que ser decisao
# explicita de quem faz o deploy, nunca o padrao: enquanto nao existir
# autenticacao (RF09, Passo 6), qualquer um na mesma rede conseguiria
# ler e apagar o cadastro inteiro.
server.address=127.0.0.1

# O Flyway e o dono do schema. Nunca alterar para update/create.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Declarado em vez de herdado: nenhuma resposta de erro leva mensagem
# de excecao ou stack trace para o cliente. O detalhe vai para o log,
# via GlobalExceptionHandler.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ATENCAO: manter o Swagger ligado so faz sentido em desenvolvimento.
# Antes de qualquer deploy, desligar no perfil do ambiente:
#   springdoc.api-docs.enabled=false
#   springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html


# Documentos de certificado (Passo 8). O limite tambem e checado no
# ArquivoCertificadoService -- aqui o Tomcat recusa antes de ler o corpo
# inteiro, la a regra fica junto da validacao de conteudo.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
