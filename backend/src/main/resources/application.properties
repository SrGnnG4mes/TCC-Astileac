spring.application.name=astileac-backend

# Profile ativo por padrao em ambiente de desenvolvimento local.
# application-local.properties nao vai para o Git (ver .gitignore);
# copie application-example.properties para cria-lo.
spring.profiles.active=local

# O Flyway e o dono do schema. Nunca alterar para update/create.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger-ui.html
