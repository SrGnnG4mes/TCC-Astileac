# Copie este arquivo para application-local.properties e preencha com
# as suas credenciais locais. application-local.properties esta no
# .gitignore e NUNCA deve ser commitado.

spring.datasource.url=jdbc:postgresql://localhost:5432/astileac
spring.datasource.username=postgres
spring.datasource.password=troque-esta-senha

# Caminho local onde os certificados enviados sao armazenados.
# Tambem esta no .gitignore.
app.uploads.dir=./uploads

# Conta administrativa inicial (RF09). Usada UMA vez, quando o banco
# ainda nao tem nenhum usuario: o sistema gera o hash BCrypt a partir
# daqui, entao a senha em texto nunca chega ao banco. Depois de criar
# a conta e trocar a senha, remova a linha abaixo.
app.admin.login=admin
app.admin.senha-inicial=troque-esta-senha-tambem
